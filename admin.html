<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Pink Corner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <h1>Sweet Pink Corner</h1>

            <ul>
                <li><a href="index.html">Startsida</a></li>
                <li><a href="about.html">Om oss</a></li>
            </ul>
        </nav>
    </header>

    <img class="hero-image" src="images/kanelbullar.png" alt="">

    <main>
        <h2>Admin</h2>

        <div class="product-form">
            <h2>Lägg till ny produkt</h2>

            <form id="product-form">
                <label for="product-name">Produktnamn:</label>
                <input type="text" id="product-name">

                <label for="description">Beskrivning:</label>
                <textarea id="description"></textarea>

                <label for="price">Pris:</label>
                <input type="number" id="price">

                <button type="submit">Lägg till produkt</button>

                <p id="message"></p>
            </form>
        </div>

        <section class="products-list">
            <h2>Produkter</h2>

            <div id="products-container"></div>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <div class="opening-hours">
                <h3>Öppettider</h3>
                <p>Måndag - Fredag: 07:00 - 18:00</p>
                <p>Lördag: 08:00 - 18:00</p>
                <p>Söndag: 19:00 - 17:00</p>
            </div>

            <div class="footer-links">
                <ul>
                    <li><a href="index.html">Hem</a></li>
                    <li><a href="about.html">Om oss</a></li>
                    <li><a href="adminlogin.html">Admin Login</a></li>
                </ul>
            </div>
        </div>
    </footer>


    <script src="js/admin.js"></script>
</body>

</html>
